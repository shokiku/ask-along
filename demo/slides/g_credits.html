<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;background:#101318;color:#F3F1EC;font-family:-apple-system,"Helvetica Neue",sans-serif;padding:110px 140px;display:flex;flex-direction:column;justify-content:center}

p.l{font-size:44px;color:#AEB6C4;max-width:1500px;line-height:1.35}

.a{font-size:52px;color:#5E6878}
